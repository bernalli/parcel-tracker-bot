name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    # Dependabot-triggered runs get a read-only GITHUB_TOKEN: gitleaks-action
    # cannot post its PR comment and dies with HTTP 403. Dependabot diffs are
    # dependency manifests only; the push/schedule scans still cover everything.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install bandit[toml]
      # bandit runs as a plain blocking gate: findings fail the job directly,
      # with no SARIF upload to code scanning.
      - run: bandit -r src -ll

  pip-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # --exclude-editable: keep the project itself out of the freeze — pip-audit
      # would try to git-clone it anonymously, which can fail depending on repo access.
      - run: pip freeze --exclude-editable > requirements.txt
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
